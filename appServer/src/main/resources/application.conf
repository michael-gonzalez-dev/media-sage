# Ktor server configuration (HOCON format)
# Environment variables override defaults using ${?ENV_VAR} syntax
# The ? means "optional" — if the env var isn't set, the default value is kept

ktor {
    deployment {
        # Server bind address and port
        host = "0.0.0.0"
        port = 8080
        port = ${?PORT}
    }

    application {
        # Points to the module function that installs plugins and routes
        # When using EngineMain, Ktor calls this function automatically
        modules = [com.mediasage.appserver.ApplicationKt.module]
    }
}

# App-specific configuration — API keys loaded from environment variables
# No defaults for secrets — they MUST come from the environment
app {
    claude {
        apiKey = ${?CLAUDE_API_KEY}

        # Max Claude API calls the encourage endpoint will make per calendar day (UTC)
        dailyCallLimit = 300
        dailyCallLimit = ${?CLAUDE_DAILY_CALL_LIMIT}

        # Max Claude API calls the daily-reflection (briefing) endpoint will make per calendar day (UTC).
        # A user makes about 2-4 a day (each briefing is generated once, then cached and synced), at most 20.
        dailyReflectionLimit = 2000
        dailyReflectionLimit = ${?CLAUDE_DAILY_REFLECTION_LIMIT}

        # Max requests one caller (IP address) may make per hour to each Claude-backed endpoint
        encouragePerCallerPerHour = 120
        encouragePerCallerPerHour = ${?ENCOURAGE_PER_CALLER_PER_HOUR}
        reflectionPerCallerPerHour = 60
        reflectionPerCallerPerHour = ${?REFLECTION_PER_CALLER_PER_HOUR}
    }

    news {
        apiKey = ${?GNEWS_API_KEY}
    }

    db {
        # Absolute path to the SQLite database file — MUST be set via environment variable
        # to avoid stray DB files being created in whatever directory the server is launched from
        path = ${?DB_PATH}
    }

    baseUrl = "http://localhost:8080"
    baseUrl = ${?BASE_URL}

    supabase {
        url = ${?SUPABASE_URL}
        dbUrl = ${?SUPABASE_DB_URL}
    }
}
